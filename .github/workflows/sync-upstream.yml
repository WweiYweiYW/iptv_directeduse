name: Sync with Upstream Repository

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库地址'
        required: true
        default: 'vbskycn/iptv'
      upstream_branch:
        description: '上游分支名称'
        required: true
        default: 'master'
  # 每6小时自动运行一次
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ master ]

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream snapshot
        shell: bash
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo || 'vbskycn/iptv' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git check-ref-format "refs/heads/${UPSTREAM_BRANCH}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "refs/heads/${UPSTREAM_BRANCH}"
          upstream_commit=$(git rev-parse FETCH_HEAD)

          # 仅复制上游快照，不合并上游历史，避免引入上游 workflow 提交。
          git read-tree --reset -u "$upstream_commit"
          # 精确保留本仓库的 workflow，包括原本不存在此目录的情况。
          if [ -n "$(git ls-tree HEAD -- .github/workflows)" ]; then
            git restore --source=HEAD --staged --worktree -- .github/workflows
          else
            git rm -r -f --ignore-unmatch -- .github/workflows
          fi

          if git diff --cached --quiet; then
            echo "无需同步：非 workflow 内容没有变化。" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Sync upstream snapshot from ${UPSTREAM_REPO} (${UPSTREAM_BRANCH})"
            git push origin HEAD:refs/heads/master
            echo "已同步上游非 workflow 内容；本仓库 workflow 保持不变。" >> "$GITHUB_STEP_SUMMARY"
          fi
